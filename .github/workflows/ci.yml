name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        python-version: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Validate required repository files
        run: |
          test -s README.md
          test -s CHANGELOG.md
          test -s AGENTS.md
          test -s Makefile
          test -s docs/architecture.md
          test -s docs/contracts.md
          test -s scripts/install.sh
          test -s scripts/smoke-install.sh
          test -s packaging/systemd/toolsapi-worker.service
      - name: Install package
        run: python -m pip install .
      - name: Run checks
        run: make check
      - name: Smoke-test isolated install
        run: make smoke-install

  system-install:
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Ubuntu prerequisites
        run: sudo apt-get update && sudo apt-get install -y python3-venv
      - name: Run system installer
        run: sudo ./scripts/install.sh
      - name: Verify installed CLI and systemd unit
        run: |
          /opt/toolsapi-worker/.venv/bin/toolsapi-worker status
          systemctl is-enabled toolsapi-worker.service
          test -f /etc/toolsapi-worker/toolsapi-worker.env
          test -f /etc/systemd/system/toolsapi-worker.service
      - name: Verify installer is idempotent
        run: sudo ./scripts/install.sh
      - name: Uninstall while retaining config
        run: |
          sudo ./scripts/uninstall.sh
          test ! -e /opt/toolsapi-worker
          test -f /etc/toolsapi-worker/toolsapi-worker.env
