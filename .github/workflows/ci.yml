name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        python-version: ['3.10', '3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Validate required repository files
        run: |
          test -s README.md
          test -s CHANGELOG.md
          test -s AGENTS.md
          test -s Makefile
          test -s .env.example
          test -s docs/architecture.md
          test -s docs/contracts.md
          test -s scripts/install.sh
          test -s scripts/install-macos.sh
          test -s scripts/uninstall-macos.sh
          test -s scripts/install-windows.ps1
          test -s scripts/windows-gpu-policy.ps1
          test -s scripts/uninstall-windows.ps1
          test -s scripts/smoke-install.sh
          test -s src/toolsapi_worker/windows_service.py
          test -s packaging/systemd/toolsapi-worker.service
          test -s packaging/launchd/net.tornevall.toolsapi-worker.plist
      - name: Install package
        run: python -m pip install .
      - name: Run checks
        run: make check
      - name: Smoke-test isolated install
        run: make smoke-install

  windows-core:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install protocol and Windows service package
        run: python -m pip install ".[windows]"
      - name: Run deterministic worker tests
        run: python -m unittest discover -s tests -v
      - name: Validate native Windows service module
        run: |
          python -m py_compile src/toolsapi_worker/windows_service.py
          python -c "import toolsapi_worker.windows_service as service; assert service.SERVICE_NAME == 'ToolsAPIWorker'"
      - name: Exercise native Windows service registration and startup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $serviceName = 'ToolsAPIWorker'
          $envFile = $null
          try {
            python -m toolsapi_worker.windows_service --startup manual install
            if ($LASTEXITCODE -ne 0) { throw "Windows service registration returned exit code $LASTEXITCODE." }

            $service = Get-Service -Name $serviceName -ErrorAction Stop
            if ($service.Status -ne 'Stopped') { throw 'New CI service should be registered but not started.' }

            $prefix = (& python -c "import sys; print(sys.exec_prefix)").Trim()
            $pythonExe = (& python -c "import sys; print(sys.executable)").Trim()
            $registered = Get-CimInstance Win32_Service -Filter "Name='$serviceName'"
            if (-not $registered) { throw 'Registered Windows service metadata was not found.' }
            if ($registered.PathName -notlike "*$prefix*pythonservice.exe*") {
              throw "Windows service host escaped the active Python prefix: $($registered.PathName)"
            }
            if (-not (Test-Path (Join-Path $prefix 'pythonservice.exe'))) {
              throw 'Explicit pythonservice.exe was not prepared inside the active Python prefix.'
            }
            if (-not (Get-ChildItem -Path $prefix -Filter 'python*.dll' -File -ErrorAction SilentlyContinue)) {
              throw 'Python runtime DLL was not copied beside the Windows service host.'
            }
            if (-not (Get-ChildItem -Path $prefix -Filter 'pywintypes*.dll' -File -ErrorAction SilentlyContinue)) {
              throw 'pywintypes runtime DLL was not copied beside the Windows service host.'
            }

            # Give LocalSystem the same bounded runtime inputs the production installer writes.
            # The loop points at an intentionally closed local port so no real provider or ToolsAPI
            # traffic is needed; WorkerApiError is retried and keeps the service alive.
            $envFile = Join-Path $prefix 'toolsapi-worker-service-ci.env'
            @(
              'TOOLS_API_BASE_URL=http://127.0.0.1:9',
              'TOOLS_WORKER_TOKEN=ci-service-token',
              'TOOLS_WORKER_ID=windows-ci-service',
              'TOOLS_WORKER_CONCURRENCY=1',
              'TOOLS_WORKER_POLL_SECONDS=1',
              'TOOLS_WORKER_HEARTBEAT_SECONDS=1',
              'TOOLS_WORKER_ENABLED_HANDLERS=whisper.transcribe',
              'TOOLS_WORKER_WHISPER_MODELS=small',
              'TOOLS_WORKER_WHISPER_DEVICE=cpu',
              'TOOLS_WORKER_WHISPER_COMPUTE_TYPE=int8',
              'TOOLS_WORKER_ACCEPTS_URL_SOURCES=false',
              'TOOLS_WORKER_DIARIZATION_ENABLED=false',
              'TOOLS_WORKER_DIARIZATION_PROVIDER=pyannote',
              'TOOLS_WORKER_DIARIZATION_MODEL=pyannote/speaker-diarization-community-1',
              'TOOLS_WORKER_DIARIZATION_DEVICE=auto'
            ) | Set-Content -Path $envFile -Encoding UTF8

            $parametersKey = "HKLM:\SYSTEM\CurrentControlSet\Services\$serviceName\Parameters"
            New-Item -Path $parametersKey -Force | Out-Null
            New-ItemProperty -Path $parametersKey -Name 'EnvFile' -PropertyType String -Value $envFile -Force | Out-Null
            New-ItemProperty -Path $parametersKey -Name 'PythonExe' -PropertyType String -Value $pythonExe -Force | Out-Null

            Start-Service -Name $serviceName
            $service = Get-Service -Name $serviceName
            $service.WaitForStatus('Running', (New-TimeSpan -Seconds 15))
            Start-Sleep -Seconds 3
            $service.Refresh()
            if ($service.Status -ne 'Running') {
              throw "Windows service did not remain running under LocalSystem; status=$($service.Status)."
            }
          }
          finally {
            $existing = Get-Service -Name $serviceName -ErrorAction SilentlyContinue
            if ($existing) {
              if ($existing.Status -ne 'Stopped') {
                Stop-Service -Name $serviceName -Force -ErrorAction SilentlyContinue
                try { $existing.WaitForStatus('Stopped', (New-TimeSpan -Seconds 15)) } catch { }
              }
              python -m toolsapi_worker.windows_service remove
              if ($LASTEXITCODE -ne 0) { throw "Windows service cleanup returned exit code $LASTEXITCODE." }
            }
            if ($envFile -and (Test-Path $envFile)) {
              Remove-Item -Path $envFile -Force
            }
          }
      - name: Parse Windows installer scripts
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path scripts/install-windows.ps1), [ref]$null, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | Format-List | Out-String | Write-Error }
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path scripts/windows-gpu-policy.ps1), [ref]$null, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | Format-List | Out-String | Write-Error }
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path scripts/uninstall-windows.ps1), [ref]$null, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | Format-List | Out-String | Write-Error }
          $install = Get-Content scripts/install-windows.ps1 -Raw
          $policy = Get-Content scripts/windows-gpu-policy.ps1 -Raw
          if ($install -match 'ScheduledTask|New-ScheduledTask|Register-ScheduledTask') { throw 'Windows worker must run as a service, not Task Scheduler.' }
          if ($install -notmatch 'ToolsAPIWorker') { throw 'Windows service name is missing from installer.' }
          if ($install -notmatch 'nvidia-smi\.exe') { throw 'Native NVIDIA detection is missing from installer.' }
          if ($install -notmatch 'get_cuda_device_count') { throw 'CTranslate2 CUDA validation is missing from installer.' }
          if ($install -notmatch 'torch\.cuda\.is_available') { throw 'PyTorch CUDA validation is missing from installer.' }
          if ($install -notmatch 'torch\.ones') { throw 'PyTorch CUDA kernel validation is missing from installer.' }
          if ($policy -notmatch 'int8_float32') { throw 'Pascal-compatible CTranslate2 compute-type policy is missing.' }
          if ($policy -notmatch 'download\.pytorch\.org/whl/cu126') { throw 'Legacy NVIDIA PyTorch CUDA 12.6 policy is missing.' }

  macos-install:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Validate Apple Silicon runner and launchd template
        run: |
          test "$(uname -m)" = arm64
          plutil -lint packaging/launchd/net.tornevall.toolsapi-worker.plist
      - name: Verify PEP 668-safe local install
        run: make install
      - name: Verify locally installed CLI
        run: .venv/bin/toolsapi-worker status
      - name: Exercise launchd installer, reinstall and uninstall
        run: |
          mkdir -p "$RUNNER_TEMP/fake-bin" "$RUNNER_TEMP/LaunchAgents"
          printf '#!/bin/sh\nexit 0\n' > "$RUNNER_TEMP/fake-bin/ffmpeg"
          chmod +x "$RUNNER_TEMP/fake-bin/ffmpeg"
          export PATH="$RUNNER_TEMP/fake-bin:$PATH"
          export PREFIX="$RUNNER_TEMP/toolsapi-worker"
          export ENV_FILE="$PREFIX/.env"
          export PLIST_DIR="$RUNNER_TEMP/LaunchAgents"

          bash ./scripts/install-macos.sh
          test -f "$ENV_FILE"
          grep -q '^TOOLS_WORKER_POLL_SECONDS=60$' "$ENV_FILE"
          grep -q '^TOOLS_WORKER_WHISPER_DEVICE=metal$' "$ENV_FILE"
          grep -q '^TOOLS_WORKER_DIARIZATION_ENABLED=true$' "$ENV_FILE"
          "$PREFIX/.venv/bin/toolsapi-worker" status --env-file "$ENV_FILE" | grep -q 'device=metal'
          plutil -lint "$PLIST_DIR/net.tornevall.toolsapi-worker.plist"
          grep -q -- '--env-file' "$PLIST_DIR/net.tornevall.toolsapi-worker.plist"
          grep -q "$RUNNER_TEMP/fake-bin" "$PLIST_DIR/net.tornevall.toolsapi-worker.plist"
          /usr/libexec/PlistBuddy -c 'Print :EnvironmentVariables:PATH' "$PLIST_DIR/net.tornevall.toolsapi-worker.plist" | grep -q "$RUNNER_TEMP/fake-bin"

          printf '\nTOOLS_INSTALL_TEST_SENTINEL=preserve-me\n' >> "$ENV_FILE"
          bash ./scripts/install-macos.sh
          grep -q '^TOOLS_INSTALL_TEST_SENTINEL=preserve-me$' "$ENV_FILE"
          /usr/libexec/PlistBuddy -c 'Print :EnvironmentVariables:PATH' "$PLIST_DIR/net.tornevall.toolsapi-worker.plist" | grep -q "$RUNNER_TEMP/fake-bin"

          bash ./scripts/uninstall-macos.sh
          test -f "$ENV_FILE"
          grep -q '^TOOLS_INSTALL_TEST_SENTINEL=preserve-me$' "$ENV_FILE"
          test ! -e "$PREFIX/.venv"
          test ! -e "$PLIST_DIR/net.tornevall.toolsapi-worker.plist"

  system-install:
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Ubuntu prerequisites
        run: sudo apt-get update && sudo apt-get install -y python3-venv
      - name: Run system installer
        run: sudo ./scripts/install.sh
      - name: Verify installed CLI, .env and systemd unit
        run: |
          /opt/toolsapi-worker/.venv/bin/toolsapi-worker status
          systemctl is-enabled toolsapi-worker.service
          sudo test -f /opt/toolsapi-worker/.env
          sudo grep -q '^TOOLS_WORKER_DIARIZATION_ENABLED=true$' /opt/toolsapi-worker/.env
          test -f /etc/systemd/system/toolsapi-worker.service
          grep -q '^EnvironmentFile=/opt/toolsapi-worker/.env$' /etc/systemd/system/toolsapi-worker.service
      - name: Verify installer is idempotent and preserves .env
        run: |
          printf '\nTOOLS_INSTALL_TEST_SENTINEL=preserve-me\n' | sudo tee -a /opt/toolsapi-worker/.env >/dev/null
          sudo ./scripts/install.sh
          sudo grep -q '^TOOLS_INSTALL_TEST_SENTINEL=preserve-me$' /opt/toolsapi-worker/.env
      - name: Uninstall while retaining .env
        run: |
          sudo ./scripts/uninstall.sh
          sudo test -f /opt/toolsapi-worker/.env
          sudo grep -q '^TOOLS_INSTALL_TEST_SENTINEL=preserve-me$' /opt/toolsapi-worker/.env
          test ! -e /opt/toolsapi-worker/.venv
