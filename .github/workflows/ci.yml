name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        python-version: ['3.10', '3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Validate required repository files
        run: |
          test -s README.md
          test -s CHANGELOG.md
          test -s AGENTS.md
          test -s Makefile
          test -s .env.example
          test -s docs/architecture.md
          test -s docs/contracts.md
          test -s scripts/install.sh
          test -s scripts/install-macos.sh
          test -s scripts/uninstall-macos.sh
          test -s scripts/smoke-install.sh
          test -s packaging/systemd/toolsapi-worker.service
          test -s packaging/launchd/net.tornevall.toolsapi-worker.plist
      - name: Install package
        run: python -m pip install .
      - name: Run checks
        run: make check
      - name: Smoke-test isolated install
        run: make smoke-install

  macos-install:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Validate Apple Silicon runner and launchd template
        run: |
          test "$(uname -m)" = arm64
          plutil -lint packaging/launchd/net.tornevall.toolsapi-worker.plist
      - name: Verify PEP 668-safe local install
        run: make install
      - name: Verify locally installed CLI
        run: .venv/bin/toolsapi-worker status
      - name: Exercise launchd installer, reinstall and uninstall
        run: |
          mkdir -p "$RUNNER_TEMP/fake-bin" "$RUNNER_TEMP/LaunchAgents"
          printf '#!/bin/sh\nexit 0\n' > "$RUNNER_TEMP/fake-bin/ffmpeg"
          chmod +x "$RUNNER_TEMP/fake-bin/ffmpeg"
          export PATH="$RUNNER_TEMP/fake-bin:$PATH"
          export PREFIX="$RUNNER_TEMP/toolsapi-worker"
          export ENV_FILE="$PREFIX/.env"
          export PLIST_DIR="$RUNNER_TEMP/LaunchAgents"

          bash ./scripts/install-macos.sh
          test -f "$ENV_FILE"
          grep -q '^TOOLS_WORKER_WHISPER_DEVICE=metal$' "$ENV_FILE"
          "$PREFIX/.venv/bin/toolsapi-worker" status --env-file "$ENV_FILE" | grep -q 'device=metal'
          plutil -lint "$PLIST_DIR/net.tornevall.toolsapi-worker.plist"
          grep -q -- '--env-file' "$PLIST_DIR/net.tornevall.toolsapi-worker.plist"

          printf '\nTOOLS_INSTALL_TEST_SENTINEL=preserve-me\n' >> "$ENV_FILE"
          bash ./scripts/install-macos.sh
          grep -q '^TOOLS_INSTALL_TEST_SENTINEL=preserve-me$' "$ENV_FILE"

          bash ./scripts/uninstall-macos.sh
          test -f "$ENV_FILE"
          grep -q '^TOOLS_INSTALL_TEST_SENTINEL=preserve-me$' "$ENV_FILE"
          test ! -e "$PREFIX/.venv"
          test ! -e "$PLIST_DIR/net.tornevall.toolsapi-worker.plist"

  system-install:
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Ubuntu prerequisites
        run: sudo apt-get update && sudo apt-get install -y python3-venv
      - name: Run system installer
        run: sudo ./scripts/install.sh
      - name: Verify installed CLI, .env and systemd unit
        run: |
          /opt/toolsapi-worker/.venv/bin/toolsapi-worker status
          systemctl is-enabled toolsapi-worker.service
          sudo test -f /opt/toolsapi-worker/.env
          test -f /etc/systemd/system/toolsapi-worker.service
          grep -q '^EnvironmentFile=/opt/toolsapi-worker/.env$' /etc/systemd/system/toolsapi-worker.service
      - name: Verify installer is idempotent and preserves .env
        run: |
          printf '\nTOOLS_INSTALL_TEST_SENTINEL=preserve-me\n' | sudo tee -a /opt/toolsapi-worker/.env >/dev/null
          sudo ./scripts/install.sh
          sudo grep -q '^TOOLS_INSTALL_TEST_SENTINEL=preserve-me$' /opt/toolsapi-worker/.env
      - name: Uninstall while retaining .env
        run: |
          sudo ./scripts/uninstall.sh
          sudo test -f /opt/toolsapi-worker/.env
          sudo grep -q '^TOOLS_INSTALL_TEST_SENTINEL=preserve-me$' /opt/toolsapi-worker/.env
          test ! -e /opt/toolsapi-worker/.venv
