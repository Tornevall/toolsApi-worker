name: One-shot fix worker terminal heartbeat regression

on:
  push:
    branches:
      - fix/50-terminal-heartbeat-contract

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/50-terminal-heartbeat-contract
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore independent heartbeat contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/toolsapi_worker/runtime.py')
          text = path.read_text()
          text = text.replace('        self._dispatch_lock = threading.Lock()\n', '')
          old = '''    def submit_terminal(self, submit: Callable[[], dict[str, Any]]) -> dict[str, Any]:
        """Serialize terminal acknowledgement against heartbeat dispatch."""
        with self._dispatch_lock:
            self.assert_owned()
            response = submit()
            self._terminal_accepted.set()
            self._stop.set()
            self._wake.set()
            return response
'''
          new = '''    def submit_terminal(self, submit: Callable[[], dict[str, Any]]) -> dict[str, Any]:
        """Keep heartbeat active until terminal state is actually acknowledged."""
        self.assert_owned()
        response = submit()
        self._terminal_accepted.set()
        self._stop.set()
        self._wake.set()
        return response
'''
          if old not in text:
              raise SystemExit('submit_terminal block not found')
          text = text.replace(old, new, 1)
          old = '''            with self._dispatch_lock:
                if self._stop.is_set() or self._terminal_accepted.is_set():
                    return
                try:
                    self._report_snapshot(state)
                    self._last_error = None
                    retrying = False
                except WorkerLeaseLostError as exc:
                    self._last_error = exc
                    self._lease_lost.set()
                    return
                except WorkerApiError as exc:
                    self._last_error = exc
                    retrying = True
                    continue
'''
          new = '''            if self._stop.is_set() or self._terminal_accepted.is_set():
                return
            try:
                self._report_snapshot(state)
                self._last_error = None
                retrying = False
            except WorkerLeaseLostError as exc:
                self._last_error = exc
                self._lease_lost.set()
                return
            except WorkerApiError as exc:
                self._last_error = exc
                retrying = True
                continue
'''
          if old not in text:
              raise SystemExit('heartbeat dispatch block not found')
          path.write_text(text.replace(old, new, 1))

          path = Path('docs/contracts.md')
          text = path.read_text()
          needle = 'The same independent heartbeat remains active while a terminal completion, failure, or diarization result is awaiting acknowledgement or retry. The worker stops it only after ToolsAPI accepts terminal state or definitively rejects the lease, so a transient terminal HTTP/network failure cannot create a lease-expiry gap after expensive processing has finished.\n'
          addition = needle + '\nBecause heartbeat and terminal HTTP requests are independent, a progress request can already be in flight when ToolsAPI accepts terminal state. The worker stops initiating new heartbeat reports as soon as that acknowledgement returns, while ToolsAPI treats a late progress request from the same worker, lease id and generation as an accepted-terminal no-op. This preserves lease freshness while acknowledgement is unresolved without allowing a late progress packet to reopen or mutate terminal state.\n'
          if needle not in text:
              raise SystemExit('contract insertion point not found')
          path.write_text(text.replace(needle, addition, 1))

          path = Path('CHANGELOG.md')
          text = path.read_text()
          old = '- Stop future Whisper heartbeat/progress updates immediately after ToolsAPI accepts a terminal completion/failure acknowledgement, while keeping the independent heartbeat alive throughout unresolved terminal retries. This narrows the post-terminal lease-race window that could produce a follow-up HTTP 409 after a successful terminal submission. Fixes #48.\n'
          new = '- Keep Whisper heartbeat/progress independent while completion, failure or diarization-only acknowledgement is unresolved, then stop initiating new reports immediately after ToolsAPI accepts terminal state. A same-worker/same-lease/same-generation progress request already in flight at that boundary is handled as an accepted-terminal no-op by ToolsAPI instead of reopening state or producing a noisy lease-loss race. Fixes #48 and #50.\n'
          if old not in text:
              raise SystemExit('changelog entry not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Run focused deterministic regressions
        run: |
          python -m unittest \
            tests.test_runtime.WorkerRuntimeTest.test_heartbeat_continues_until_completion_acknowledgement \
            tests.test_runtime.WorkerRuntimeTest.test_heartbeat_continues_until_failure_acknowledgement \
            tests.test_runtime.WorkerRuntimeTest.test_heartbeat_continues_until_diarization_only_acknowledgement \
            tests.test_terminal_post_ack_and_mlx_stage.TerminalAndMlxProgressRegressionTest.test_accepted_terminal_response_stops_future_heartbeat_reports \
            tests.test_terminal_post_ack_and_mlx_stage.TerminalAndMlxProgressRegressionTest.test_mlx_waiting_before_first_segment_reports_preparation_not_active_transcription \
            tests.test_terminal_post_ack_and_mlx_stage.TerminalAndMlxProgressRegressionTest.test_first_mlx_timestamped_segment_switches_stage_to_transcribing
      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          rm .github/workflows/one-shot-fix-50.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/toolsapi_worker/runtime.py docs/contracts.md CHANGELOG.md .github/workflows/one-shot-fix-50.yml
          git commit -m 'Restore independent terminal heartbeat lifecycle'
          git push origin HEAD:fix/50-terminal-heartbeat-contract
