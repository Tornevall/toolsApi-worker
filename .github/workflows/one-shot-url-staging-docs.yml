name: One-shot URL staging docs sync

on:
  push:
    branches:
      - docs/26-exact-target-claims
    paths:
      - '.github/workflows/one-shot-url-staging-docs.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/26-exact-target-claims
          fetch-depth: 0

      - name: Synchronize exact-target URL staging documentation
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          replacements = {
              'AGENTS.md': [(
                  "Workers truthfully advertise installed handler versions and capabilities. ToolsAPI uses those advertisements for automatic scheduling. A job actually returned by a supported current ToolsAPI claim policy is authoritative: an administrator-selected exact target may intentionally exceed the worker's advertised model, diarization or URL scheduler capability. The worker must attempt the returned declarative job and report a real failure through the normal terminal path when its local runtime cannot satisfy it; never falsify capability advertisement, silently downgrade requirements or bypass lease safety to accommodate forced work.",
                  "Workers truthfully advertise installed handler versions and capabilities. ToolsAPI uses those advertisements for automatic scheduling. A job actually returned by a supported current ToolsAPI claim policy is authoritative: an administrator-selected exact target may intentionally exceed the worker's advertised model or diarization scheduler capability. URL input is different: ToolsAPI must not force a raw external URL onto a worker that does not advertise URL support. It may instead stage that URL-origin source on the Tools host and return it as normal lease-bound `tools_media`. The worker must attempt the returned declarative job and report a real failure through the normal terminal path when its local runtime cannot satisfy it; never falsify capability advertisement, silently downgrade requirements or bypass lease safety to accommodate forced work."
              )],
              'CHANGELOG.md': [(
                  "Clarified exact administrator-target claim semantics for ToolsAPI #1732 / worker #26: capability advertisement continues to govern automatic scheduling, while a job actually returned by a supported current claim policy is authoritative even when an exact target exceeds advertised model, diarization or URL capability. The worker keeps the existing runtime behavior of attempting the unchanged claim and reporting a real retryable/terminal failure when unsupported; wire schema, authentication, lease handling and capability advertisement are unchanged.",
                  "Clarified exact administrator-target claim semantics for ToolsAPI #1732 / worker #26: capability advertisement continues to govern automatic scheduling, while a job actually returned by a supported current claim policy is authoritative even when an exact target exceeds advertised model or diarization capability. URL input remains capability-safe: a worker without URL support is not forced to fetch the external URL; ToolsAPI may stage the URL-origin media and deliver it through the existing lease-bound `tools_media` path instead. Worker runtime code, wire schema, authentication, lease handling and capability advertisement remain unchanged."
              )],
              'README.md': [(
                  "Live polling requires ToolsAPI to advertise `claim_policy_version >= 2`. If an older ToolsAPI deployment does not support the diarization-aware capability gate, the worker refuses to consume jobs. This makes deploy order safe. Capability advertisement controls normal automatic assignment, but a job actually returned by a supported current policy is authoritative. ToolsAPI may return an administrator-selected exact target even when its requested model, diarization or URL input exceeds what this worker advertised; the worker attempts the unchanged request and reports its normal retryable/terminal failure if the local runtime cannot execute it.",
                  "Live polling requires ToolsAPI to advertise `claim_policy_version >= 2`. If an older ToolsAPI deployment does not support the diarization-aware capability gate, the worker refuses to consume jobs. This makes deploy order safe. Capability advertisement controls normal automatic assignment, but a job actually returned by a supported current policy is authoritative. ToolsAPI may return an administrator-selected exact target across advertised model or diarization mismatches; the worker attempts the unchanged request and reports its normal retryable/terminal failure if the local runtime cannot execute it. Raw URL input is still only returned to workers that advertise URL support. For a URL-origin job targeting a worker without that support, ToolsAPI may download and verify the source itself and then return the staged binary through the normal lease-bound `tools_media` path."
              )],
              'docs/contracts.md': [(
                  "For automatic scheduling, ToolsAPI leaves incompatible jobs queued rather than mutating them. A normal automatically selected job with `diarization_requested=true` is assigned only to a version 2 worker that advertises `supports_diarization=true`. Diarization-only work is also restricted to workers that truthfully advertise this capability. An administrator-selected exact remote target is different: after worker authentication and current-contract validation, ToolsAPI may intentionally return that exact transcription job despite an advertised model, diarization or URL capability mismatch. This does not change what the worker advertises or the claim schema. The returned claim is authoritative and the worker attempts its unchanged requirements; a locally unsupported requirement is reported through the ordinary failure path.",
                  "For automatic scheduling, ToolsAPI leaves incompatible jobs queued rather than mutating them. A normal automatically selected job with `diarization_requested=true` is assigned only to a version 2 worker that advertises `supports_diarization=true`. Diarization-only work is also restricted to workers that truthfully advertise this capability. An administrator-selected exact remote target is different: after worker authentication and current-contract validation, ToolsAPI may intentionally return that exact transcription job across advertised model or diarization mismatches. Raw external URL input is not forced through a URL-capability mismatch. When the selected remote path does not advertise URL support, ToolsAPI may first stage the URL-origin source and then return it as lease-bound `tools_media`. This does not change what the worker advertises or the claim schema. The returned claim is authoritative and the worker attempts its unchanged transcription requirements; a locally unsupported requirement is reported through the ordinary failure path."
              ),(
                  "A successful claim may contain a job or the existing idle result `job: null`. A null job is not an error and the worker must continue its normal poll loop. A returned job from a supported current claim policy is authoritative. The worker does not re-run ToolsAPI's scheduler decision against its own advertised capability set: if an exact administrator target requests an unsupported configured model, unavailable diarization, or disabled URL execution, the normal runtime attempt fails explicitly and is submitted through the existing retryable/terminal failure path instead of silently discarding the claim. Lease ownership and terminal acknowledgement rules are unchanged.",
                  "A successful claim may contain a job or the existing idle result `job: null`. A null job is not an error and the worker must continue its normal poll loop. A returned job from a supported current claim policy is authoritative. The worker does not re-run ToolsAPI's scheduler decision against its own advertised model/diarization capability set: if an exact administrator target requests an unsupported configured model or unavailable diarization, the normal runtime attempt fails explicitly and is submitted through the existing retryable/terminal failure path instead of silently discarding the claim. URL execution remains explicit: raw URL claims are only valid when URL support is advertised; otherwise ToolsAPI can stage the URL-origin media and return `tools_media`, which the worker downloads through its authenticated lease. Lease ownership and terminal acknowledgement rules are unchanged."
              )],
          }

          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text()
              for old, new in pairs:
                  if text.count(old) != 1:
                      raise SystemExit(f'{filename}: expected exactly one match')
                  text = text.replace(old, new, 1)
              path.write_text(text)
          PY

          rm -f .github/workflows/one-shot-url-staging-docs.yml
          git diff --check
          git config user.name 'ToolsAPI automation'
          git config user.email 'toolsapi-automation@users.noreply.github.com'
          git add AGENTS.md CHANGELOG.md README.md docs/contracts.md .github/workflows/one-shot-url-staging-docs.yml
          git commit -m 'Document Tools-side URL media staging'
          git push origin HEAD:docs/26-exact-target-claims
