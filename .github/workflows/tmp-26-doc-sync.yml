name: Temporary issue 26 documentation sync

on:
  push:
    branches:
      - docs/26-exact-target-claims
    paths:
      - .github/workflows/tmp-26-doc-sync.yml

permissions:
  contents: write

jobs:
  sync-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/26-exact-target-claims

      - name: Update worker contract documentation
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Missing expected text in {path}: {old[:120]}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'AGENTS.md',
              '- Workers advertise installed handler versions and capabilities and only claim compatible jobs.\n',
              '- Workers truthfully advertise installed handler versions and capabilities. ToolsAPI uses those advertisements for automatic scheduling. A job actually returned by a supported current ToolsAPI claim policy is authoritative: an administrator-selected exact target may intentionally exceed the worker\'s advertised model, diarization or URL scheduler capability. The worker must attempt the returned declarative job and report a real failure through the normal terminal path when its local runtime cannot satisfy it; never falsify capability advertisement, silently downgrade requirements or bypass lease safety to accommodate forced work.\n'
          )

          replace_once(
              'README.md',
              '2. Claim one compatible job and receive lease id + generation.\n',
              '2. Claim one automatically compatible job, or an authoritative administrator-forced exact-target job, and receive lease id + generation.\n'
          )
          replace_once(
              'README.md',
              'Live polling requires ToolsAPI to advertise `claim_policy_version >= 2`. If an older ToolsAPI deployment does not support the diarization-aware capability gate, the worker refuses to consume jobs. This makes deploy order safe.\n',
              'Live polling requires ToolsAPI to advertise `claim_policy_version >= 2`. If an older ToolsAPI deployment does not support the diarization-aware capability gate, the worker refuses to consume jobs. This makes deploy order safe. Capability advertisement controls normal automatic assignment, but a job actually returned by a supported current policy is authoritative. ToolsAPI may return an administrator-selected exact target even when its requested model, diarization or URL input exceeds what this worker advertised; the worker attempts the unchanged request and reports its normal retryable/terminal failure if the local runtime cannot execute it.\n'
          )

          replace_once(
              'docs/contracts.md',
              'ToolsAPI must leave incompatible jobs queued rather than mutating them. A job with `diarization_requested=true` may only be assigned to a version 2 worker that advertises `supports_diarization=true`. Diarization-only work is also restricted to workers that truthfully advertise this capability.\n',
              'For automatic scheduling, ToolsAPI leaves incompatible jobs queued rather than mutating them. A normal automatically selected job with `diarization_requested=true` is assigned only to a version 2 worker that advertises `supports_diarization=true`. Diarization-only work is also restricted to workers that truthfully advertise this capability. An administrator-selected exact remote target is different: after worker authentication and current-contract validation, ToolsAPI may intentionally return that exact transcription job despite an advertised model, diarization or URL capability mismatch. This does not change what the worker advertises or the claim schema. The returned claim is authoritative and the worker attempts its unchanged requirements; a locally unsupported requirement is reported through the ordinary failure path.\n'
          )
          replace_once(
              'docs/contracts.md',
              'A successful claim may contain a job or the existing idle result `job: null`. A null job is not an error and the worker must continue its normal poll loop.\n',
              'A successful claim may contain a job or the existing idle result `job: null`. A null job is not an error and the worker must continue its normal poll loop. A returned job from a supported current claim policy is authoritative. The worker does not re-run ToolsAPI\'s scheduler decision against its own advertised capability set: if an exact administrator target requests an unsupported configured model, unavailable diarization, or disabled URL execution, the normal runtime attempt fails explicitly and is submitted through the existing retryable/terminal failure path instead of silently discarding the claim. Lease ownership and terminal acknowledgement rules are unchanged.\n'
          )

          p = Path('CHANGELOG.md')
          text = p.read_text(encoding='utf-8')
          marker = '### Changed\n\n'
          entry = '- Clarified exact administrator-target claim semantics for ToolsAPI #1732 / worker #26: capability advertisement continues to govern automatic scheduling, while a job actually returned by a supported current claim policy is authoritative even when an exact target exceeds advertised model, diarization or URL capability. The worker keeps the existing runtime behavior of attempting the unchanged claim and reporting a real retryable/terminal failure when unsupported; wire schema, authentication, lease handling and capability advertisement are unchanged.\n'
          if entry not in text:
              if marker not in text:
                  raise SystemExit('Missing CHANGELOG Changed marker')
              text = text.replace(marker, marker + entry, 1)
              p.write_text(text, encoding='utf-8')

      - name: Commit documentation and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-26-doc-sync.yml
          git add AGENTS.md README.md CHANGELOG.md docs/contracts.md
          git commit -m "Document authoritative exact-target claims (#26)"
          git push origin HEAD:docs/26-exact-target-claims
