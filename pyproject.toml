[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "toolsapi-worker"
version = "0.1.2.dev0"
description = "Standalone worker runtime for delegated Tornevall ToolsAPI workloads"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Tornevall Networks"}]
dependencies = []

[project.optional-dependencies]
whisper = [
    "faster-whisper>=1.2.1,<2",
    "pyannote.audio>=4,<5",
    "torch>=2.2",
]
whisper-mlx = [
    "mlx-whisper>=0.4.3,<0.5",
    "pyannote.audio>=4,<5",
    "torch>=2.2",
]
windows = [
    "pywin32>=306; platform_system == 'Windows'",
]

[project.scripts]
toolsapi-worker = "toolsapi_worker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
