[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "toolsapi-worker"
version = "0.1.0.dev0"
description = "Standalone worker runtime for delegated Tornevall ToolsAPI workloads"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Tornevall Networks"}]
dependencies = []

[project.optional-dependencies]
whisper = ["faster-whisper>=1.2.1,<2"]
whisper-mlx = ["mlx-whisper>=0.4.3,<0.5"]

[project.scripts]
toolsapi-worker = "toolsapi_worker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
